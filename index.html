<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Regiões</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {

    .alerta {

    .admin-btn {

      margin-top: 0;

    .admin-lista {

    .bairro-item {

    .sair {

    }

    .aviso {

      color: #777;
      font-size: 13px;
      margin-top: 10px;
    }


    /* =========================================================
       ROTAS
       ========================================================= */

    .rotas-section {
      margin-top: 35px;
    }

    .rotas-titulo {
      text-align: center;
      margin-bottom: 8px;
    }

    .rotas-subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 18px;
    }

    .rota-card {
      background: white;
      border-radius: 12px;

    .rota-dados {

    .confirmar-retorno {

    }

      color: #777;

    }

    .admin-separador {
      margin: 30px 0 20px;

      padding-top: 20px;
    }

    .rota-admin-item {

    }

    .rota-admin-status {

    }

    @media (max-width: 600px) {
      .busca {
        flex-direction: column;
      }

        width: 100%;
      }

      .admin-formularios {
        grid-template-columns: 1fr;
      }

  </style>
</head>

<body>

  <div class="container">

    <h1>Consulta de Regiões</h1>

    <div class="subtitulo">
      Digite um bairro ou município
    </div>

    <div class="busca">
      <input
        type="text"
        id="campoBusca"
        placeholder="Ex.: Vila Mariana"
        onkeydown="if(event.key === 'Enter') pesquisar()"
      >

      <button onclick="pesquisar()">
        Pesquisar
      </button>
    </div>

    <div class="aviso">
      A busca ignora acentos, maiúsculas/minúsculas e aceita JD/Jardim e PQ/Parque.
    </div>

    <div id="resultado" class="resultado"></div>

    <div class="rotas-section">
      <h2 class="rotas-titulo">🚚 Rotas</h2>
      <div class="rotas-subtitulo">Acompanhamento das rotas em andamento</div>
      <div id="rotasPublicas"></div>
    </div>

    <button class="admin-btn" onclick="abrirAdmin()">
      ⚙️ Gerenciar sistema
    </button>

    <div id="admin" class="admin"></div>

  </div>


<script>

/* =========================================================
   CONFIGURAÇÃO DO SUPABASE
   ========================================================= */

const SUPABASE_URL =
  'https://gqvsaaazmnjfoxwfnjpq.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_JjrMDLXcK0B0ex7USowq0g_1VeEcbCX';

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   NORMALIZAÇÃO DA BUSCA
   ========================================================= */

function normalizar(texto) {

  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\bjd\.?\b/g, "jardim")
    .replace(/\bpq\.?\b/g, "parque")
    .replace(/\s+/g, " ")
    .trim();

}


/* =========================================================
   PESQUISA
   ========================================================= */

async function pesquisar() {

  const campo = document.getElementById("campoBusca");
  const resultado = document.getElementById("resultado");

  const buscaOriginal = campo.value.trim();

  if (!buscaOriginal) {

    resultado.innerHTML =
      '<div class="erro">Digite um bairro ou município.</div>';

    return;
  }

  resultado.innerHTML =
    '<div class="card">Pesquisando...</div>';

  try {

    const { data, error } =
      await supabaseClient
        .from("bairros")
        .select("*");

    if (error) {
      throw error;
    }

    const busca = normalizar(buscaOriginal);

let encontrados = data.filter(item => {
  const nome = normalizar(item.bairro);
  return nome === busca;
});


    if (encontrados.length === 0) {

      resultado.innerHTML = `
        <div class="card">
          <div class="erro">
            Bairro ou município não encontrado.
          </div>
        </div>
      `;

      return;
    }


    /*
      Primeiro pegamos todas as regiões encontradas.
    */

    const regioes = [
      ...new Set(
        encontrados.map(item => item.regiao)
      )
    ];


    /*
      Interior é tratado de maneira especial.
    */

    const temInterior =
      regioes.some(
        regiao =>
          normalizar(regiao) === "interior"
      );


    const outrasRegioes =
      regioes.filter(
        regiao =>
          normalizar(regiao) !== "interior"
      );


    /*
      Se houver outra região além de Interior,
      ela é predominante.
    */

    let html = "";


    if (outrasRegioes.length > 0) {

      outrasRegioes.forEach(regiao => {

        html += `
          <div class="card">

            <div class="regiao">
              ${escapeHtml(regiao)}
            </div>

            ${
              temInterior
              ?
              `
                <div class="alerta">
                  🩷 Atenção: imprimir na folha rosa.
                </div>
              `
              :
              ""
            }

          </div>
        `;

      });

    } else {

      /*
        Só encontrou Interior.
      */

      html = `
        <div class="card">

          <div class="regiao">
            Interior
          </div>

          <div class="alerta">
            🩷 Atenção: imprimir na folha rosa.
          </div>

        </div>
      `;

    }


    resultado.innerHTML = html;

  } catch (error) {

    console.error(error);

    resultado.innerHTML = `
      <div class="card">
        <div class="erro">
          Erro ao consultar o banco de dados.
        </div>
      </div>
    `;

  }

}


/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function escapeHtml(texto) {

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   ADMIN
   ========================================================= */

async function abrirAdmin() {

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();


  if (session) {

    mostrarPainelAdmin();

  } else {

    mostrarLogin();

  }

}


/* =========================================================
   LOGIN
   ========================================================= */

function mostrarLogin() {

  const admin =
    document.getElementById("admin");

  admin.style.display = "block";

  admin.innerHTML = `

    <h2>Área administrativa</h2>

    <div class="campo">

      <label>E-mail</label>

      <input
        type="email"
        id="adminEmail"
        placeholder="Seu e-mail"
      >

    </div>


    <div class="campo">

      <label>Senha</label>

      <input
        type="password"
        id="adminSenha"
        placeholder="Sua senha"
      >

    </div>


    <button onclick="login()">
      Entrar
    </button>

    <div id="loginErro"></div>

  `;

}


async function login() {

  const email =
    document.getElementById("adminEmail").value;

  const senha =
    document.getElementById("adminSenha").value;

  const erro =
    document.getElementById("loginErro");


  erro.innerHTML = "";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: senha
    });


  if (error) {

    erro.innerHTML = `
      <p class="erro">
        E-mail ou senha incorretos.
      </p>
    `;

    return;
  }


  mostrarPainelAdmin();

}


/* =========================================================
   PAINEL ADMIN
   ========================================================= */

async function mostrarPainelAdmin() {

  const admin =
    document.getElementById("admin");

  admin.style.display = "block";

  admin.innerHTML = `

    <h2>Gerenciar sistema</h2>

    <button class="sair" onclick="sairAdmin()">
      Sair
    </button>

    <div class="admin-formularios">

      <div class="admin-bloco">
        <h3>📍 Gerenciar bairros</h3>

        <div class="campo">
          <label>Bairro / Município</label>
          <input
            type="text"
            id="novoBairro"
            placeholder="Ex.: Jardim Primavera"
          >
        </div>

        <div class="campo">
          <label>Região</label>
          <input
            type="text"
            id="novaRegiao"
            placeholder="Ex.: Santo Amaro"
          >
        </div>

        <button onclick="adicionarBairro()">
          + Adicionar bairro
        </button>

        <div class="campo" style="margin-top:20px">
          <label>Pesquisar bairro para editar ou excluir</label>
          <input
            type="text"
            id="filtroAdmin"
            placeholder="Digite o nome do bairro..."
            oninput="carregarBairros()"
          >
        </div>

        <div id="adminLista" class="lista-bairros-admin"></div>
      </div>

      <div class="admin-bloco">
        <h3>🚚 Gerenciar rotas</h3>

        <div class="campo">
          <label>Motorista</label>
          <input
            type="text"
            id="novoMotorista"
            placeholder="Nome do motorista"
          >
        </div>

        <div class="campo">
          <label>Placa</label>
          <input
            type="text"
            id="novaPlaca"
            placeholder="ABC1D23"
          >
        </div>

        <div class="campo">
          <label>Região</label>
          <input
            type="text"
            id="novaRegiaoRota"
            placeholder="Ex.: Santo Amaro"
          >
        </div>

        <div class="campo">
          <label>Ajudante</label>
          <input
            type="text"
            id="novoAjudante"
            placeholder="Nome do ajudante"
          >
        </div>

        <div class="campo">
          <label>Observação</label>
          <input
            type="text"
            id="novaObservacao"
            placeholder="Observação (opcional)"
          >
        </div>

        <button onclick="adicionarRota()">
          + Adicionar rota
        </button>
      </div>

    </div>

    <div class="admin-lista">
      <h3>🚚 Rotas cadastradas</h3>
      <div id="adminRotasLista"></div>
    </div>


  `;


  carregarBairros();
  carregarRotasAdmin();

}


/* =========================================================
   ADICIONAR BAIRRO
   ========================================================= */

async function adicionarBairro() {

  const bairro =
    document.getElementById("novoBairro").value.trim();

  const regiao =
    document.getElementById("novaRegiao").value.trim();


  if (!bairro || !regiao) {

    alert("Preencha o bairro e a região.");

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("bairros")
      .insert([
        {
          bairro: bairro,
          regiao: regiao
        }
      ]);


  if (error) {

    console.error(error);

    alert(
      "Não foi possível adicionar o bairro."
    );

    return;
  }


  document.getElementById("novoBairro").value = "";
  document.getElementById("novaRegiao").value = "";


  alert("Bairro adicionado com sucesso!");

  carregarBairros();

}


/* =========================================================
   CARREGAR BAIRROS
   ========================================================= */

async function carregarBairros() {

  const lista =
    document.getElementById("adminLista");


  if (!lista) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("bairros")
      .select("*")
      .order("bairro");


  if (error) {

    lista.innerHTML =
      '<div class="erro">Erro ao carregar bairros.</div>';

    return;
  }


  const filtroInput =
    document.getElementById("filtroAdmin");

  const filtro =
    filtroInput
      ? normalizar(filtroInput.value)
      : "";

  if (!filtro) {
    lista.innerHTML = `
      <p class="aviso">
        Digite um bairro acima para encontrar os registros que deseja editar ou excluir.
      </p>
    `;
    return;
  }

  const bairrosFiltrados =
    data.filter(item =>
      normalizar(item.bairro).includes(filtro) ||
      normalizar(item.regiao).includes(filtro)
    );

  if (bairrosFiltrados.length === 0) {
    lista.innerHTML =
      "<p>Nenhum bairro encontrado.</p>";
    return;
  }


  lista.innerHTML =
    bairrosFiltrados.map(item => `

      <div class="bairro-item">

        <div class="bairro-info">

          <div class="bairro-nome">
            ${escapeHtml(item.bairro)}
          </div>

          <div class="bairro-regiao">
            ${escapeHtml(item.regiao)}
          </div>

        </div>


        <div class="acoes">

          <button
            class="editar"
            onclick="editarBairro(${item.id}, '${escapeJs(item.bairro)}', '${escapeJs(item.regiao)}')"
          >
            Editar
          </button>


          <button
            class="excluir"
            onclick="excluirBairro(${item.id})"
          >
            Excluir
          </button>

        </div>

      </div>

    `).join("");

}



/* =========================================================
   ROTAS - ÁREA PÚBLICA
   ========================================================= */

async function carregarRotasPublicas() {

  const container = document.getElementById("rotasPublicas");

  if (!container) return;

  const { data, error } =
    await supabaseClient
      .from("rotas")
      .select("*")
      .order("status", { ascending: true })
      .order("criado_em", { ascending: false });

  if (error) {
    console.error(error);
    container.innerHTML =
      '<div class="card erro">Erro ao carregar as rotas.</div>';
    return;
  }

  if (!data || data.length === 0) {
    container.innerHTML =
      '<div class="card rota-vazia">Nenhuma rota cadastrada no momento.</div>';
    return;
  }

  container.innerHTML = data.map(rota => {

    const confirmada = rota.status === "retorno_confirmado";

    const statusHtml = confirmada
      ? `🟢 Retorno confirmado às ${formatarHora(rota.retorno_confirmado_em)}`
      : `🟡 Em rota`;

    return `
      <div class="rota-card ${confirmada ? "confirmada" : ""}">

        <div class="rota-status ${confirmada ? "confirmada" : "em-rota"}">
          ${statusHtml}
        </div>

        <div class="rota-dados">
          <div><strong>Motorista:</strong> ${escapeHtml(rota.motorista)}</div>
          <div><strong>Placa:</strong> ${escapeHtml(rota.placa)}</div>
          <div><strong>Região:</strong> ${escapeHtml(rota.regiao)}</div>
          ${
            rota.ajudante
              ? `<div><strong>Ajudante:</strong> ${escapeHtml(rota.ajudante)}</div>`
              : ""
          }
        </div>

        ${
          rota.observacao
            ? `<div class="rota-observacao"><strong>Observação:</strong> ${escapeHtml(rota.observacao)}</div>`
            : ""
        }

      </div>
    `;

  }).join("");
}


/* =========================================================
   ROTAS - ADMIN
   ========================================================= */

async function adicionarRota() {

  const motorista = document.getElementById("novoMotorista").value.trim();
  const placa = document.getElementById("novaPlaca").value.trim();
  const regiao = document.getElementById("novaRotaRegiao").value.trim();
  const ajudante = document.getElementById("novoAjudante").value.trim();
  const observacao = document.getElementById("novaObservacao").value.trim();

  if (!motorista || !placa || !regiao) {
    alert("Preencha motorista, placa e região.");
    return;
  }

  const { error } =
    await supabaseClient
      .from("rotas")
      .insert([{
        motorista,
        placa,
        regiao,
        ajudante: ajudante || null,
        observacao: observacao || null,
        status: "em_rota"
      }]);

  if (error) {
    console.error(error);
    alert("Não foi possível adicionar a rota.");
    return;
  }

  document.getElementById("novoMotorista").value = "";
  document.getElementById("novaPlaca").value = "";
  document.getElementById("novaRotaRegiao").value = "";
  document.getElementById("novoAjudante").value = "";
  document.getElementById("novaObservacao").value = "";

  alert("Rota adicionada com sucesso!");

  carregarRotasAdmin();
  carregarRotasPublicas();
}


async function carregarRotasAdmin() {

  const lista = document.getElementById("rotasAdmin");

  if (!lista) return;

  const { data, error } =
    await supabaseClient
      .from("rotas")
      .select("*")
      .order("status", { ascending: true })
      .order("criado_em", { ascending: false });

  if (error) {
    console.error(error);
    lista.innerHTML =
      '<div class="erro">Erro ao carregar rotas.</div>';
    return;
  }

  if (!data || data.length === 0) {
    lista.innerHTML = "<p>Nenhuma rota cadastrada.</p>";
    return;
  }

  lista.innerHTML = data.map(rota => {

    const confirmada = rota.status === "retorno_confirmado";

    return `
      <div class="rota-admin-item">

        <div class="rota-admin-status ${confirmada ? "confirmada" : "em-rota"}">
          ${
            confirmada
              ? `🟢 Retorno confirmado às ${formatarHora(rota.retorno_confirmado_em)}`
              : "🟡 Em rota"
          }
        </div>

        <div class="rota-dados">
          <div><strong>Motorista:</strong> ${escapeHtml(rota.motorista)}</div>
          <div><strong>Placa:</strong> ${escapeHtml(rota.placa)}</div>
          <div><strong>Região:</strong> ${escapeHtml(rota.regiao)}</div>
          ${
            rota.ajudante
              ? `<div><strong>Ajudante:</strong> ${escapeHtml(rota.ajudante)}</div>`
              : ""
          }
          ${
            rota.observacao
              ? `<div><strong>Observação:</strong> ${escapeHtml(rota.observacao)}</div>`
              : ""
          }
        </div>

        <div class="acoes" style="margin-top:10px; flex-wrap:wrap;">

          ${
            !confirmada
              ? `
                <button
                  class="confirmar-retorno"
                  onclick="confirmarRetorno(${rota.id})">
                  ✓ Confirmar retorno
                </button>
              `
              : ""
          }

          <button
            class="editar"
            onclick="editarRota(${rota.id})">
            Editar
          </button>

          <button
            class="excluir"
            onclick="excluirRota(${rota.id})">
            Excluir
          </button>

        </div>

      </div>
    `;

  }).join("");
}


async function confirmarRetorno(id) {

  const confirmar =
    confirm("Confirmar o retorno desta rota?");

  if (!confirmar) return;

  const { error } =
    await supabaseClient
      .from("rotas")
      .update({
        status: "retorno_confirmado",
        retorno_confirmado_em: new Date().toISOString()
      })
      .eq("id", id);

  if (error) {
    console.error(error);
    alert("Não foi possível confirmar o retorno.");
    return;
  }

  carregarRotasAdmin();
  carregarRotasPublicas();
}


async function editarRota(id) {

  const { data, error } =
    await supabaseClient
      .from("rotas")
      .select("*")
      .eq("id", id)
      .single();

  if (error || !data) {
    alert("Não foi possível carregar a rota.");
    return;
  }

  const motorista = prompt("Motorista:", data.motorista);
  if (motorista === null) return;

  const placa = prompt("Placa:", data.placa);
  if (placa === null) return;

  const regiao = prompt("Região:", data.regiao);
  if (regiao === null) return;

  const ajudante = prompt("Ajudante:", data.ajudante || "");
  if (ajudante === null) return;

  const observacao = prompt("Observação:", data.observacao || "");
  if (observacao === null) return;

  if (!motorista.trim() || !placa.trim() || !regiao.trim()) {
    alert("Motorista, placa e região não podem ficar vazios.");
    return;
  }

  const { error: updateError } =
    await supabaseClient
      .from("rotas")
      .update({
        motorista: motorista.trim(),
        placa: placa.trim(),
        regiao: regiao.trim(),
        ajudante: ajudante.trim() || null,
        observacao: observacao.trim() || null
      })
      .eq("id", id);

  if (updateError) {
    console.error(updateError);
    alert("Não foi possível editar a rota.");
    return;
  }

  alert("Rota atualizada!");

  carregarRotasAdmin();
  carregarRotasPublicas();
}


async function excluirRota(id) {

  const confirmar =
    confirm("Tem certeza que deseja excluir esta rota?");

  if (!confirmar) return;

  const { error } =
    await supabaseClient
      .from("rotas")
      .delete()
      .eq("id", id);

  if (error) {
    console.error(error);
    alert("Não foi possível excluir a rota.");
    return;
  }

  alert("Rota excluída!");

  carregarRotasAdmin();
  carregarRotasPublicas();
}


function formatarHora(dataIso) {

  if (!dataIso) return "--:--";

  return new Date(dataIso).toLocaleTimeString("pt-BR", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

}


/* =========================================================
   ESCAPAR JAVASCRIPT
   ========================================================= */

function escapeJs(texto) {

  return String(texto)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

}


/* =========================================================
   EDITAR BAIRRO
   ========================================================= */

async function editarBairro(
  id,
  bairroAtual,
  regiaoAtual
) {

  const novoBairro =
    prompt(
      "Nome do bairro/município:",
      bairroAtual
    );


  if (novoBairro === null) {
    return;
  }


  const novaRegiao =
    prompt(
      "Região:",
      regiaoAtual
    );


  if (novaRegiao === null) {
    return;
  }


  if (
    !novoBairro.trim() ||
    !novaRegiao.trim()
  ) {

    alert(
      "Os campos não podem ficar vazios."
    );

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("bairros")
      .update({
        bairro: novoBairro.trim(),
        regiao: novaRegiao.trim()
      })
      .eq("id", id);


  if (error) {

    console.error(error);

    alert(
      "Não foi possível editar o bairro."
    );

    return;
  }


  alert("Bairro atualizado!");

  carregarBairros();

}
