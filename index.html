<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Regiões</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1f6;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .busca {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 15px;
      cursor: pointer;
      background: #5b3b6e;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .resultado {
      margin-top: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .regiao {
      font-size: 25px;
      font-weight: bold;
      color: #5b3b6e;
    }

    .alerta {
      margin-top: 12px;
      padding: 12px;
      background: #ffe5ef;
      border-radius: 8px;
      font-weight: bold;
      color: #9b2855;
    }

    .erro {
      color: #a00000;
      font-weight: bold;
      text-align: center;
    }

    .admin-btn {
      width: 100%;
      margin-top: 30px;
      background: #333;
    }

    .admin {
      display: none;
      margin-top: 25px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .admin h2 {
      margin-top: 0;
    }

    .campo {
      margin-bottom: 12px;
    }

    .campo label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .admin-lista {
      margin-top: 25px;
    }

    .bairro-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    .bairro-info {
      flex: 1;
    }

    .bairro-nome {
      font-weight: bold;
    }

    .bairro-regiao {
      color: #666;
      font-size: 14px;
    }

    .acoes {
      display: flex;
      gap: 5px;
    }

    .editar {
      background: #5b3b6e;
      padding: 8px 10px;
    }

    .excluir {
      background: #a00000;
      padding: 8px 10px;
    }

    .sair {
      background: #555;
      margin-bottom: 15px;
    }

    .aviso {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .busca {
        flex-direction: column;
      }

      .busca button {
        width: 100%;
      }

      .bairro-item {
        flex-direction: column;
        align-items: stretch;
      }

      .acoes button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Consulta de Regiões</h1>

    <div class="subtitulo">
      Digite um bairro ou município
    </div>

    <div class="busca">
      <input
        type="text"
        id="campoBusca"
        placeholder="Ex.: Vila Mariana"
        onkeydown="if(event.key === 'Enter') pesquisar()"
      >

      <button onclick="pesquisar()">
        Pesquisar
      </button>
    </div>

    <div class="aviso">
      A busca ignora acentos, maiúsculas/minúsculas e aceita JD/Jardim e PQ/Parque.
    </div>

    <div id="resultado" class="resultado"></div>

    <button class="admin-btn" onclick="abrirAdmin()">
      ⚙️ Adicionar / editar bairros
    </button>

    <div id="admin" class="admin"></div>

  </div>


<script>

/* =========================================================
   CONFIGURAÇÃO DO SUPABASE
   ========================================================= */

const SUPABASE_URL =
  'https://gqvsaaazmnjfoxwfnjpq.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_JjrMDLXcK0B0ex7USowq0g_1VeEcbCX';

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   NORMALIZAÇÃO DA BUSCA
   ========================================================= */

function normalizar(texto) {

  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\bjd\.?\b/g, "jardim")
    .replace(/\bpq\.?\b/g, "parque")
    .replace(/\s+/g, " ")
    .trim();

}


/* =========================================================
   PESQUISA
   ========================================================= */

async function pesquisar() {

  const campo = document.getElementById("campoBusca");
  const resultado = document.getElementById("resultado");

  const buscaOriginal = campo.value.trim();

  if (!buscaOriginal) {

    resultado.innerHTML =
      '<div class="erro">Digite um bairro ou município.</div>';

    return;
  }

  resultado.innerHTML =
    '<div class="card">Pesquisando...</div>';

  try {

    const { data, error } =
      await supabaseClient
        .from("bairros")
        .select("*");

    if (error) {
      throw error;
    }

    const busca = normalizar(buscaOriginal);

    const encontrados = data.filter(item => {

      const nome = normalizar(item.bairro);

      return (
        nome === busca ||
        nome.includes(busca) ||
        busca.includes(nome)
      );

    });


    if (encontrados.length === 0) {

      resultado.innerHTML = `
        <div class="card">
          <div class="erro">
            Bairro ou município não encontrado.
          </div>
        </div>
      `;

      return;
    }


    /*
      Primeiro pegamos todas as regiões encontradas.
    */

    const regioes = [
      ...new Set(
        encontrados.map(item => item.regiao)
      )
    ];


    /*
      Interior é tratado de maneira especial.
    */

    const temInterior =
      regioes.some(
        regiao =>
          normalizar(regiao) === "interior"
      );


    const outrasRegioes =
      regioes.filter(
        regiao =>
          normalizar(regiao) !== "interior"
      );


    /*
      Se houver outra região além de Interior,
      ela é predominante.
    */

    let html = "";


    if (outrasRegioes.length > 0) {

      outrasRegioes.forEach(regiao => {

        html += `
          <div class="card">

            <div class="regiao">
              ${escapeHtml(regiao)}
            </div>

            ${
              temInterior
              ?
              `
                <div class="alerta">
                  🩷 Atenção: imprimir na folha rosa.
                </div>
              `
              :
              ""
            }

          </div>
        `;

      });

    } else {

      /*
        Só encontrou Interior.
      */

      html = `
        <div class="card">

          <div class="regiao">
            Interior
          </div>

        </div>
      `;

    }


    resultado.innerHTML = html;

  } catch (error) {

    console.error(error);

    resultado.innerHTML = `
      <div class="card">
        <div class="erro">
          Erro ao consultar o banco de dados.
        </div>
      </div>
    `;

  }

}


/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function escapeHtml(texto) {

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   ADMIN
   ========================================================= */

async function abrirAdmin() {

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();


  if (session) {

    mostrarPainelAdmin();

  } else {

    mostrarLogin();

  }

}


/* =========================================================
   LOGIN
   ========================================================= */

function mostrarLogin() {

  const admin =
    document.getElementById("admin");

  admin.style.display = "block";

  admin.innerHTML = `

    <h2>Área administrativa</h2>

    <div class="campo">

      <label>E-mail</label>

      <input
        type="email"
        id="adminEmail"
        placeholder="Seu e-mail"
      >

    </div>


    <div class="campo">

      <label>Senha</label>

      <input
        type="password"
        id="adminSenha"
        placeholder="Sua senha"
      >

    </div>


    <button onclick="login()">
      Entrar
    </button>

    <div id="loginErro"></div>

  `;

}


async function login() {

  const email =
    document.getElementById("adminEmail").value;

  const senha =
    document.getElementById("adminSenha").value;

  const erro =
    document.getElementById("loginErro");


  erro.innerHTML = "";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: senha
    });


  if (error) {

    erro.innerHTML = `
      <p class="erro">
        E-mail ou senha incorretos.
      </p>
    `;

    return;
  }


  mostrarPainelAdmin();

}


/* =========================================================
   PAINEL ADMIN
   ========================================================= */

async function mostrarPainelAdmin() {

  const admin =
    document.getElementById("admin");

  admin.style.display = "block";

  admin.innerHTML = `

    <h2>Gerenciar bairros</h2>

    <button class="sair" onclick="sairAdmin()">
      Sair
    </button>


    <div class="campo">

      <label>Bairro / Município</label>

      <input
        type="text"
        id="novoBairro"
        placeholder="Ex.: Jardim Primavera"
      >

    </div>


    <div class="campo">

      <label>Região</label>

      <input
        type="text"
        id="novaRegiao"
        placeholder="Ex.: Santo Amaro"
      >

    </div>


    <button onclick="adicionarBairro()">
      + Adicionar bairro
    </button>


    <div class="campo" style="margin-top:20px">

      <label>Pesquisar na lista</label>

      <input
        type="text"
        id="filtroAdmin"
        placeholder="Filtrar bairros..."
        oninput="carregarBairros()"
      >

    </div>


    <div
      id="adminLista"
      class="admin-lista">
    </div>

  `;


  carregarBairros();

}


/* =========================================================
   ADICIONAR BAIRRO
   ========================================================= */

async function adicionarBairro() {

  const bairro =
    document.getElementById("novoBairro").value.trim();

  const regiao =
    document.getElementById("novaRegiao").value.trim();


  if (!bairro || !regiao) {

    alert("Preencha o bairro e a região.");

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("bairros")
      .insert([
        {
          bairro: bairro,
          regiao: regiao
        }
      ]);


  if (error) {

    console.error(error);

    alert(
      "Não foi possível adicionar o bairro."
    );

    return;
  }


  document.getElementById("novoBairro").value = "";
  document.getElementById("novaRegiao").value = "";


  alert("Bairro adicionado com sucesso!");

  carregarBairros();

}


/* =========================================================
   CARREGAR BAIRROS
   ========================================================= */

async function carregarBairros() {

  const lista =
    document.getElementById("adminLista");


  if (!lista) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("bairros")
      .select("*")
      .order("bairro");


  if (error) {

    lista.innerHTML =
      '<div class="erro">Erro ao carregar bairros.</div>';

    return;
  }


  const filtroInput =
    document.getElementById("filtroAdmin");

  const filtro =
    filtroInput
    ?
    normalizar(filtroInput.value)
    :
    "";


  const bairrosFiltrados =
    data.filter(item => {

      if (!filtro) {
        return true;
      }

      return (
        normalizar(item.bairro).includes(filtro) ||
        normalizar(item.regiao).includes(filtro)
      );

    });


  if (bairrosFiltrados.length === 0) {

    lista.innerHTML =
      "<p>Nenhum bairro encontrado.</p>";

    return;
  }


  lista.innerHTML =
    bairrosFiltrados.map(item => `

      <div class="bairro-item">

        <div class="bairro-info">

          <div class="bairro-nome">
            ${escapeHtml(item.bairro)}
          </div>

          <div class="bairro-regiao">
            ${escapeHtml(item.regiao)}
          </div>

        </div>


        <div class="acoes">

          <button
            class="editar"
            onclick="editarBairro(${item.id}, '${escapeJs(item.bairro)}', '${escapeJs(item.regiao)}')"
          >
            Editar
          </button>


          <button
            class="excluir"
            onclick="excluirBairro(${item.id})"
          >
            Excluir
          </button>

        </div>

      </div>

    `).join("");

}


/* =========================================================
   ESCAPAR JAVASCRIPT
   ========================================================= */

function escapeJs(texto) {

  return String(texto)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "\\r");

}


/* =========================================================
   EDITAR BAIRRO
   ========================================================= */

async function editarBairro(
  id,
  bairroAtual,
  regiaoAtual
) {

  const novoBairro =
    prompt(
      "Nome do bairro/município:",
      bairroAtual
    );


  if (novoBairro === null) {
    return;
  }


  const novaRegiao =
    prompt(
      "Região:",
      regiaoAtual
    );


  if (novaRegiao === null) {
    return;
  }


  if (
    !novoBairro.trim() ||
    !novaRegiao.trim()
  ) {

    alert(
      "Os campos não podem ficar vazios."
    );

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("bairros")
      .update({
        bairro: novoBairro.trim(),
        regiao: novaRegiao.trim()
      })
      .eq("id", id);


  if (error) {

    console.error(error);

    alert(
      "Não foi possível editar o bairro."
    );

    return;
  }


  alert("Bairro atualizado!");

  carregarBairros();

}


/* =========================================================
   EXCLUIR BAIRRO
   ========================================================= */

async function excluirBairro(id) {

  const confirmar =
    confirm(
      "Tem certeza que deseja excluir este bairro?"
    );


  if (!confirmar) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("bairros")
      .delete()
      .eq("id", id);


  if (error) {

    console.error(error);

    alert(
      "Não foi possível excluir o bairro."
    );

    return;
  }


  alert("Bairro excluído!");

  carregarBairros();

}


/* =========================================================
   SAIR
   ========================================================= */

async function sairAdmin() {

  await supabaseClient.auth.signOut();

  document.getElementById("admin").style.display =
    "none";

}


/* =========================================================
   ENTER NA PESQUISA
   ========================================================= */

document
  .getElementById("campoBusca")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        pesquisar();
      }

    }
  );

</script>

</body>
</html>
